# Map HTTP upgrade headers to safely support Streamlit's real-time WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name hermesguardian.gotihub.com localhost; 
    server_tokens off;

    # Setup explicit logging paths for easier platform monitoring
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # =========================================================================
    # 1. API GATEWAY ROUTING LAYER
    # =========================================================================
    # Targets your FastAPI backend container via the shared global network.
    # Note: The trailing slash in proxy_pass strips the '/api/' prefix when forwarding,
    # mapping 'GET /api/' directly to FastAPI's root health check 'GET /'.
    location /api/ {
        proxy_pass http://hermesguardian-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive timeouts extended to support multi-turn agentic inference cycles
        proxy_connect_timeout       600s;
        proxy_send_timeout          600s;
        proxy_read_timeout          600s;
        send_timeout                600s;
    }

    # =========================================================================
    # 2. INTERACTIVE OPENAPI DOCUMENTATION SPEC CHANNELS
    # =========================================================================
    location /docs {
        proxy_pass http://hermesguardian-api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://hermesguardian-api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # 3. STREAMLIT COCKPIT DASHBOARD FRONTEND CATCH-ALL
    # =========================================================================
    # Routes standard internet browsers straight to the Streamlit visualization hub.
    location / {
        proxy_pass http://hermesguardian-dashboard:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets handshake upgrade rules—critical to prevent Streamlit from freezing
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Extends proxy read timeout to keep the socket pipe active during long trace executions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}