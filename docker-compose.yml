version: '3.8'

services:
  api:
    build: .
    container_name: hermesguardian-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    networks:
      - gotihub_network

  dashboard:
    build: .
    container_name: hermesguardian-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8085:8501"
    env_file:
      - .env
    depends_on:
      - api
    restart: always
    networks:
      - gotihub_network

networks:
  gotihub_network:
    name: gotihub_global_network
    external: true